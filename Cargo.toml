[package]
name = "avifenc-rust"
version = "0.0.7"
edition = "2024"
rust-version = "1.88"
description = "Pure Rust AVIF encoder with avif-rust-compatible image and callback APIs"
keywords = ["avif", "av1", "image", "encoder", "codec"]
categories = ["multimedia::images", "encoding"]
license = "MIT"
repository = "https://github.com/mith-mmk/avifenc-rust.git"

[features]
default = []
multithread = ["rav1e/threading"]
profile = []

[dependencies]
avif-image-buffer = { git = "https://github.com/mith-mmk/avif-rust.git", rev = "9ed4ad242582c3375c8d8ee1365ef7d6ddc5b53a" }
gamut-bitstream = "=0.2.1"
gamut-core = "=0.1.0"
gamut-dsp = "=0.2.1"
rav1e = { version = "0.8.1", default-features = false }

[workspace]
